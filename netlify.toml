# Déploiement Netlify : « Add new site » → « Import an existing project » →
# choisir ce dépôt et la branche. Ces réglages sont repris automatiquement.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Le serveur du VPS : direct à deux, historique des deux, copies de sécurité.
  VITE_SERVEUR = "https://srv1302277.hstgr.cloud"

# Les vignettes d'exercices ne changent pas : cache long côté navigateur.
[[headers]]
  for = "/exercices/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
